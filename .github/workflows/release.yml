name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }}, ${{ matrix.deployment }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            rid: linux-x64
            deployment: bundled
            self_contained: true

          # Windows x64
          - os: windows-latest
            rid: win-x64
            deployment: bundled
            self_contained: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Pin the published SDK: the 10.0.x alias can point to unavailable builds.
          dotnet-version: "10.0.402"

      - name: Restore
        run: >
          dotnet restore
          "src/Quartermaster.Gui/Quartermaster.Gui.csproj"
          --runtime ${{ matrix.rid }}
          -p:SelfContained=${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish
        run: >
          dotnet publish
          "src/Quartermaster.Gui/Quartermaster.Gui.csproj"
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained ${{ matrix.self_contained }}
          --no-restore
          --output publish
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Build and package Windows updater
        if: matrix.rid == 'win-x64'
        shell: python
        run: |
          import subprocess

          rid = "${{ matrix.rid }}"
          configure = ["cmake", "-S", "winupdater", "-B", "winupdater/build",
                       "-DCMAKE_BUILD_TYPE=MinSizeRel", "-DBUILD_TESTING=OFF"]
          if rid == "win-x64":
              configure += ["-A", "x64"]
          subprocess.run(configure, check=True)
          subprocess.run(["cmake", "--build", "winupdater/build", "--config", "MinSizeRel"], check=True)
          subprocess.run(["cmake", "--install", "winupdater/build", "--config", "MinSizeRel", "--prefix", "publish"], check=True)

      - name: Archive application
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          Path("dist").mkdir(exist_ok=True)
          with ZipFile("dist/Quartermaster-${{ matrix.rid }}-${{ matrix.deployment }}.zip", "w", compression=ZIP_DEFLATED) as archive:
              for file in sorted(Path("publish").rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to("publish"))

      - name: Upload bundled archive
        uses: actions/upload-artifact@v7
        with:
          name: "Quartermaster-${{ matrix.rid }}-${{ matrix.deployment }}"
          path: dist/Quartermaster-${{ matrix.rid }}-${{ matrix.deployment }}.zip
          if-no-files-found: error

  appimage:
    name: Build Linux AppImage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download Linux bundled archive
        uses: actions/download-artifact@v8
        with:
          name: Quartermaster-linux-x64-bundled
          path: bundled

      - name: Extract Linux bundled archive
        run: python3 -m zipfile -e bundled/Quartermaster-linux-x64-bundled.zip publish

      - name: Build AppImage
        run: |
          tool="$(bash packaging/linux/install-appimagetool.sh "$RUNNER_TEMP/appimage-tools")"
          bash packaging/linux/build-appimage.sh publish dist "$tool" "$RUNNER_TEMP/appimage-tools/runtime-x86_64"

      - name: Upload AppImage and update file
        uses: actions/upload-artifact@v7
        with:
          name: Quartermaster-linux-x64-AppImage
          path: |
            dist/Quartermaster-linux-x64.AppImage
            dist/Quartermaster-linux-x64.AppImage.zsync
          if-no-files-found: error

  installer:
    name: Build Windows installer
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Pin the published SDK: the 10.0.x alias can point to unavailable builds.
          dotnet-version: "10.0.402"

      - name: Download Windows bundled archive
        uses: actions/download-artifact@v8
        with:
          name: Quartermaster-win-x64-bundled
          path: bundled

      - name: Extract Windows bundled archive
        shell: pwsh
        run: Expand-Archive -LiteralPath bundled/Quartermaster-win-x64-bundled.zip -DestinationPath publish

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = ./packaging/windows/install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'inno-setup')
          $version = (dotnet msbuild src/Quartermaster.Gui/Quartermaster.Gui.csproj -getProperty:Version -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the application version.' }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'The release tag does not match the application version.' }
          ./packaging/windows/build-installer.ps1 -Version $version -PublishDirectory publish -OutputDirectory dist -CompilerPath $compiler

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Quartermaster-win-x64-setup
          path: dist/Quartermaster-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, installer, appimage]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          set -- \
            Quartermaster-linux-x64-bundled.zip \
            Quartermaster-linux-x64.AppImage \
            Quartermaster-linux-x64.AppImage.zsync \
            Quartermaster-win-x64-bundled.zip \
            Quartermaster-win-x64-setup.exe
          for asset in "$@"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum "$@" > SHA256SUMS.txt

      - name: Read changelog section for tag
        id: release_notes
        run: |
          RELEASE_NOTES="$(./scripts/changelog_for_tag.bash "${{ github.ref_name }}")"

          {
            echo "body<<__RELEASE_NOTES__"
            printf '%s\n' "$RELEASE_NOTES"
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: true
