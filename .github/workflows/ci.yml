name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Run tests
        run: >
          dotnet test
          --configuration Release
          --no-build
          --no-restore

  winupdater:
    name: Windows updater
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure updater
        run: cmake -S winupdater -B winupdater/build -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=ON

      - name: Build updater
        run: cmake --build winupdater/build --config MinSizeRel

      - name: Test updater
        run: ctest --test-dir winupdater/build --build-config MinSizeRel --output-on-failure
