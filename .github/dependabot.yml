version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    ignore:
      # Avalonia.Headless.XUnit uses xUnit 3's discovery APIs; keep the framework pin.
      - dependency-name: xunit.v3
        versions: [">=4.0.0"]
    labels:
      - dependencies
      - dotnet
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
